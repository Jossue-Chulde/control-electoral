<ion-content class="ion-padding ion-text-center login-content">
  <div class="login-container">
    <h2>Control Electoral</h2>
    <p>Ingresa con tu cuenta</p>

    <form (ngSubmit)="onSubmit()">
      <ion-item>
        <ion-label position="floating">Correo Electrónico</ion-label>
        <ion-input type="email" [(ngModel)]="correo" name="correo" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="clave" name="clave" required></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="cargando">
        <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
        <span *ngIf="!cargando">Iniciar Sesión</span>
      </ion-button>
    </form>
  </div>
</ion-content>
